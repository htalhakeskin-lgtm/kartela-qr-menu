# CI (15-git-ve-ci §7). Pin third-party actions to a full commit SHA in the project
# (`uses: actions/checkout@<sha> # v5`); Dependabot keeps the SHAs current.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly: full-history secret scan + all browsers
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fake but valid values: the build validates the environment like production does.
  DATABASE_URL: postgres://app:app@localhost:5432/app_test
  NEXT_PUBLIC_PLATFORM_URL: http://localhost:3020
  PLATFORM_DEMO: "true"
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
  BETTER_AUTH_URL: http://localhost:3020
  IP_HASH_SALT: ci-only-salt-0123456789
  CRON_SECRET: ci-only-cron-secret-0123
  DEMO_ADMIN_EMAIL: yonetici@kartela.example.com
  DEMO_ADMIN_PASSWORD: ci-only-demo-password-0123

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Venue pages read the database at build time (D-14: Rakım's /stil; D-15: its menu), like the
    # Vercel build, which migrates and seeds before building (scripts/vercel-build.mjs).
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      # The production build leaves test fixtures out of the venue map (VERCEL_ENV=production);
      # a theme used only by fixtures must still build (D-01: Sade broke the first deploy).
      - name: Production-like build (fixtures excluded)
        run: pnpm db:migrate && pnpm db:seed && pnpm build
        env: { VERCEL_ENV: production }

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate # also proves every migration applies to an empty database
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium ${{ github.event_name == 'schedule' && 'webkit' || '' }}
      - run: pnpm exec playwright test --project=mobile --project=desktop ${{ github.event_name == 'schedule' && '--project=iphone' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
      # Lighthouse mobile on key pages, same build and data (U-19, lighthouserc.js):
      # size budgets, accessibility and best practices fail the job; the performance score warns
      # because shared runners vary.
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        # .lighthouseci is a hidden folder: upload-artifact skips hidden files unless asked.
        with:
          {
            name: lighthouse,
            path: .lighthouseci,
            retention-days: 7,
            if-no-files-found: ignore,
            include-hidden-files: true,
          }

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No pnpm cache: this job installs nothing, so after a lockfile change the cache misses
        # and the post step fails on a store path that does not exist.
        with: { node-version-file: .nvmrc }
      - name: Secret scan (PR commits; full history on schedule)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gitleaks git --redact --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            ./gitleaks git --redact
          fi
      - run: pnpm audit --audit-level=high
